[project]
name = "airplane-tracker"
version = "0.1.0"
description = "Tracker of airplanes by country"
authors = [
    {name = "Maxim Obroskov"}
]
readme = "README.md"
requires-python = "^3.10"
dependencies = [
    "requests (>=2.34.2,<3.0.0)"
]

packages = [{include = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
black = "^26.10.1"
isort = "^9.0.2"
flake8 = "^7.4.1"

[tool.black]
line-length = 90

[tool.isort]
profile = "black"
line_length = 90

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.poetry]
name = "airplane-tracker"
version = "0.1.0"
description = "Tracker of airplanes by country"
authors = ["Maxim Obroskov"]
readme = "README.md"
packages = [{include = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"